services:
  - type: web
    name: nexus-bot-pro
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port 10000 --server.address 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0


envVars:
  - key: PYTHONUNBUFFERED
    value: "1"
